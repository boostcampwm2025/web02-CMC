version: "3.9"

services:
  migrate:
    image: ghcr.io/boostcampwm2025/web02-cmc-backend:latest
    profiles:
      - tools
    working_dir: /app/backend
    command: npx prisma migrate deploy --schema=./prisma/schema.prisma
    env_file:
      - ./.env

  backend:
    image: ghcr.io/boostcampwm2025/web02-cmc-backend:latest
    environment:
      PORT: 3000
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/boostcampwm2025/web02-cmc-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
