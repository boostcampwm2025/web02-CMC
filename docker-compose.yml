version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: web02_users
      POSTGRES_PASSWORD: 123999
      POSTGRES_DB: web02
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    image: ghcr.io/boostcampwm2025/web02-cmc-backend:latest
    env_file:
      - ./.env
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost
      DATABASE_URL: postgresql://web02_users:123999@postgres:5432/web02?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: >
      sh -lc "cd backend &&
      pnpm prisma migrate deploy &&
      pnpm start:prod"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - cadvisor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    restart: unless-stopped

  frontend:
    image: ghcr.io/boostcampwm2025/web02-cmc-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
