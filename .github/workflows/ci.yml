name: ci

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run backend tests
        run: pnpm -C backend test

      - name: Run frontend tests
        run: pnpm -C frontend test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image names
        id: image_names
        run: |
          echo "backend_image=${IMAGE_BACKEND,,}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${IMAGE_FRONTEND,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build backend (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.backend_image }}:pr-${{ github.event.pull_request.number }}

      - name: Build frontend (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
            VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
            VITE_ENABLE_SENTRY: ${{ secrets.VITE_ENABLE_SENTRY }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.frontend_image }}:pr-${{ github.event.pull_request.number }}
