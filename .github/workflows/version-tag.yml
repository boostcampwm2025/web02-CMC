name: Version Tag

on:
  pull_request:
    types: [closed]  # PR이 닫힐 때
    branches:
      - release

permissions: {}

concurrency:
  group: ${{ github.repository }}-release-pipeline
  # Preserve every release event instead of replacing the existing pending run.
  queue: max

jobs:
  version-tag:
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.new_version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
      target_sha: ${{ steps.semver.outputs.target_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      # === jq 설치 (JSON 파싱 도구) ===
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # === 기존 병합 SHA 태그 재사용 또는 새 버전 계산 ===
      - name: Resolve release tag
        id: semver
        env:
          EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          git fetch --force --no-tags origin \
            refs/heads/release:refs/remotes/origin/release
          git fetch --force origin 'refs/tags/*:refs/tags/*'

          target_sha="$(git rev-parse "${EVENT_MERGE_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$target_sha" refs/remotes/origin/release; then
            echo "merged commit is not part of the release branch: $target_sha" >&2
            exit 1
          fi

          semver_tags="$(
            git tag --list 'v*' --sort=-v:refname \
              | grep -E "$semver_pattern" \
              || true
          )"
          latest_tag="$(printf '%s\n' "$semver_tags" | sed '/^$/d' | sed -n '1p')"

          existing_tag=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [ "$tag_sha" = "$target_sha" ]; then
              existing_tag="$tag"
              break
            fi
          done <<< "$semver_tags"

          if [ -n "$existing_tag" ]; then
            if [ "$existing_tag" != "$latest_tag" ]; then
              echo "release $target_sha already has $existing_tag, but the latest tag is $latest_tag" >&2
              echo "Use the manual rollback workflow instead of re-running an old release workflow." >&2
              exit 1
            fi

            printf 'new_version=%s\n' "${existing_tag#v}" >> "$GITHUB_OUTPUT"
            printf 'version_tag=%s\n' "$existing_tag" >> "$GITHUB_OUTPUT"
            printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
            printf 'tag_exists=true\n' >> "$GITHUB_OUTPUT"
            echo "Reusing existing release tag $existing_tag for $target_sha"
            exit 0
          fi

          labels="$(
            jq -r '.pull_request.labels[]?.name' "$GITHUB_EVENT_PATH" \
              | grep -E '^(major|minor|patch)$' \
              || true
          )"
          if [ -z "$labels" ]; then
            echo "No release label found. Skipping version tagging."
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$labels" | grep -q '^major$'; then
            bump_type="major"
          elif echo "$labels" | grep -q '^minor$'; then
            bump_type="minor"
          else
            bump_type="patch"
          fi

          if [ -n "$latest_tag" ]; then
            latest_tag_sha="$(git rev-parse "refs/tags/${latest_tag}^{commit}")"
            if ! git merge-base --is-ancestor "$latest_tag_sha" "$target_sha"; then
              if git merge-base --is-ancestor "$target_sha" "$latest_tag_sha"; then
                echo "refusing to version an older release commit after $latest_tag" >&2
              else
                echo "latest release tag $latest_tag is not in the target release history" >&2
              fi
              exit 1
            fi
          else
            latest_tag="v0.0.0"
          fi

          current_version="${latest_tag#v}"

          IFS='.' read -r major minor patch <<< "$current_version"

          case "$bump_type" in
            major)
              new_version="$((major + 1)).0.0"
              ;;
            minor)
              new_version="${major}.$((minor + 1)).0"
              ;;
            patch)
              new_version="${major}.${minor}.$((patch + 1))"
              ;;
            *)
              echo "Unknown bump type: ${bump_type}"
              exit 1
              ;;
          esac

          version_tag="v${new_version}"
          if git show-ref --verify --quiet "refs/tags/$version_tag"; then
            echo "calculated release tag already exists: $version_tag" >&2
            exit 1
          fi

          printf 'new_version=%s\n' "$new_version" >> "$GITHUB_OUTPUT"
          printf 'version_tag=%s\n' "$version_tag" >> "$GITHUB_OUTPUT"
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          printf 'tag_exists=false\n' >> "$GITHUB_OUTPUT"
          echo "New version for $target_sha will be $version_tag ($bump_type from $latest_tag)"

      # === Git 태그 생성 및 푸시 ===
      - name: Create Git tag
        if: steps.semver.outputs.should_skip != 'true' && steps.semver.outputs.tag_exists != 'true'
        env:
          TARGET_SHA: ${{ steps.semver.outputs.target_sha }}
          VERSION_TAG: ${{ steps.semver.outputs.version_tag }}
        run: |
          set -euo pipefail
          tag="$VERSION_TAG"
          target_sha="$TARGET_SHA"

          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$tag" =~ $semver_pattern ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            existing_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [ "$existing_sha" = "$target_sha" ]; then
              echo "Tag $tag already points to $target_sha. Reusing it."
              exit 0
            fi
            echo "Tag $tag already points to a different commit: $existing_sha" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$tag" "$target_sha"
          if git push origin "refs/tags/$tag"; then
            exit 0
          fi

          git tag -d "$tag" >/dev/null
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}" || true
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            remote_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [ "$remote_sha" = "$target_sha" ]; then
              echo "Tag $tag was created concurrently for the same commit. Reusing it."
              exit 0
            fi
            echo "Tag $tag was created concurrently for a different commit: $remote_sha" >&2
          else
            echo "Failed to push $tag and the tag does not exist remotely." >&2
          fi
          exit 1

  deploy-prod:
    needs: version-tag
    if: needs.version-tag.outputs.version_tag != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-prod.yml
    with:
      expected_target_sha: ${{ needs.version-tag.outputs.target_sha }}
      version_tag: ${{ needs.version-tag.outputs.version_tag }}
    secrets:
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

  github-release:
    needs: [version-tag, deploy-prod]
    if: needs.version-tag.outputs.version_tag != '' && needs.deploy-prod.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ needs.version-tag.outputs.version_tag }}
        run: |
          set -euo pipefail

          find_release() {
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${VERSION_TAG}\") | [.id, .draft, .prerelease] | @tsv" \
              | sed -n '1p'
          }

          ensure_published_release() {
            local release_state release_id is_draft is_prerelease

            release_state="$(find_release)"
            [ -n "$release_state" ] || return 1

            IFS=$'\t' read -r release_id is_draft is_prerelease <<< "$release_state"
            if [[ "$is_draft" == "true" || "$is_prerelease" == "true" ]]; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                -F draft=false \
                -F prerelease=false \
                -f "name=Release ${VERSION_TAG}" \
                >/dev/null
              echo "Published existing GitHub Release for $VERSION_TAG."
            else
              echo "GitHub Release already exists for $VERSION_TAG. Reusing it."
            fi
            return 0
          }

          if ensure_published_release; then
            exit 0
          fi

          if gh release create "$VERSION_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Release $VERSION_TAG" \
            --generate-notes; then
            exit 0
          fi

          if ensure_published_release; then
            echo "GitHub Release was created concurrently for $VERSION_TAG. Reusing it."
            exit 0
          fi

          echo "Failed to create GitHub Release for $VERSION_TAG." >&2
          exit 1
