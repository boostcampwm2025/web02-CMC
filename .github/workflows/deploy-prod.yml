name: deploy-prod

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "시멘틱 버전 태그를 입력하세요. 비워두면 최신 시멘틱 버전 태그를 사용합니다."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend-prod
  IMAGE_FRONTEND: ${{ github.repository }}-frontend-prod

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.set_version.outputs.version_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version tag
        id: set_version
        run: |
          # tag push면 그 태그가 곧 버전
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "Deploying tag from push event: ${GITHUB_REF_NAME}"
            exit 0
          fi

          # workflow_dispatch면 입력 우선, 없으면 최신 semver tag
          input_tag="${{ github.event.inputs.version_tag }}"
          if [ -n "$input_tag" ]; then
            echo "version_tag=$input_tag" >> $GITHUB_OUTPUT
            echo "Deploying input tag: $input_tag"
            exit 0
          fi

          latest_tag=$(git tag --list "v*" --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            latest_tag="latest"
          fi
          echo "version_tag=$latest_tag" >> $GITHUB_OUTPUT
          echo "Deploying latest tag: $latest_tag"

      - name: Set lowercase image names
        id: image_names
        run: |
          echo "backend_image=${IMAGE_BACKEND,,}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${IMAGE_FRONTEND,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.backend_image }}:latest
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.backend_image }}:${{ steps.set_version.outputs.version_tag }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.frontend_image }}:latest
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.frontend_image }}:${{ steps.set_version.outputs.version_tag }}

  cd-backend:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync monitoring configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NCP_HOST_PROD }}
          username: ${{ secrets.NCP_USER_PROD }}
          password: ${{ secrets.NCP_PASSWORD_PROD }}
          source: "monitoring/**"
          target: ${{ secrets.NCP_DEPLOY_PATH }}

      - name: Deploy on NCP via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NCP_HOST_PROD }}
          username: ${{ secrets.NCP_USER_PROD }}
          password: ${{ secrets.NCP_PASSWORD_PROD }}
          script: |
            set -e

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            cd "${{ secrets.NCP_DEPLOY_PATH }}"

            VERSION_TAG="${{ needs.ci.outputs.version_tag }}"
            export VERSION_TAG

            echo "Deploying version: ${VERSION_TAG}"

            # === 기존 컨테이너 종료 ===
            docker compose -f docker-compose.yml down || true

            # === 이미지 pull ===
            docker compose -f docker-compose.yml pull

            # === Prisma Migration용 컨테이너 실행 ===
            docker compose -f docker-compose.yml run --rm migrate

            # === 오래된 이미지 정리 ===
            docker image prune -f

            # === 새 버전 실행 ===
            docker compose -f docker-compose.yml up -d

            echo "[SUCCESS] Deployment completed successfully ✅"

  cd-frontend:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_ENABLE_SENTRY: ${{ secrets.VITE_ENABLE_SENTRY }}
        run: pnpm -C frontend build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install AWS CLI (NCP compatible)
        run: pip install awscli==1.15.85

      - name: Upload to NCP Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NCP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NCP_SECRET_KEY }}
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.NCP_BUCKET }}/${{ secrets.NCP_BUCKET_ROOT }} \
            --endpoint-url ${{ secrets.NCP_ENDPOINT }} \
            --exclude "index.html" \
            --delete \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 sync frontend/dist/ s3://${{ secrets.NCP_BUCKET }}/${{ secrets.NCP_BUCKET_ROOT }} \
            --endpoint-url ${{ secrets.NCP_ENDPOINT }} \
            --exclude "*" \
            --include "index.html" \
            --acl public-read \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployed to Object Storage successfully!"
