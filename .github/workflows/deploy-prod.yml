name: deploy-prod

on:
  workflow_call:
    inputs:
      expected_target_sha:
        description: "태그가 가리켜야 하는 release merge SHA"
        required: true
        type: string
      version_tag:
        description: "자동 배포할 GCP 시멘틱 버전 태그"
        required: true
        type: string
    secrets:
      VITE_SENTRY_DSN:
        description: "프런트엔드 Sentry 빌드 DSN"
        required: true
  workflow_dispatch:
    inputs:
      version_tag:
        description: "배포할 기존 GCP 시멘틱 버전 태그를 입력하세요."
        required: true
        type: string

concurrency:
  group: ${{ github.repository }}-deploy-prod
  # Preserve automatic deploys and manual rollbacks while another deploy runs.
  queue: max

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      deployment_mode: ${{ steps.version.outputs.deployment_mode }}
      target_sha: ${{ steps.version.outputs.target_sha }}
      version_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        env:
          EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha }}
          PULL_REQUEST_MERGED: ${{ github.event.pull_request.merged }}
          REQUESTED_VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [[ "$GITHUB_REF" != "refs/heads/release" || "$PULL_REQUEST_MERGED" != "true" ]]; then
                echo "automatic prod deployment must originate from a merged release pull request" >&2
                exit 1
              fi
              deployment_mode="release"
              expected_target_sha="${EXPECTED_TARGET_SHA:-}"
              version_tag="${REQUESTED_VERSION_TAG:-}"
              ;;
            workflow_dispatch)
              if [[ "$GITHUB_REF" != "refs/heads/release" ]]; then
                echo "manual prod deployment must run from the release branch" >&2
                exit 1
              fi
              deployment_mode="rollback"
              expected_target_sha=""
              version_tag="${REQUESTED_VERSION_TAG:-}"
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$version_tag" =~ $semver_pattern ]]; then
            echo "invalid release tag: $version_tag" >&2
            exit 1
          fi

          git fetch --force origin 'refs/tags/*:refs/tags/*'
          if ! git show-ref --verify --quiet "refs/tags/$version_tag"; then
            echo "release tag does not exist: $version_tag" >&2
            exit 1
          fi

          target_sha="$(git rev-parse "refs/tags/${version_tag}^{commit}")"
          git fetch --force --no-tags origin \
            refs/heads/release:refs/remotes/origin/release
          if ! git merge-base --is-ancestor "$target_sha" refs/remotes/origin/release; then
            echo "release tag must point to a commit from the release branch" >&2
            exit 1
          fi

          if [[ "$deployment_mode" == "release" ]]; then
            if ! [[ "$expected_target_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "automatic deployment requires a full expected release SHA" >&2
              exit 1
            fi
            if [[ "$target_sha" != "$expected_target_sha" ]]; then
              echo "release tag $version_tag points to $target_sha, expected $expected_target_sha" >&2
              exit 1
            fi

            latest_tag="$(
              git tag --list 'v*' --sort=-v:refname \
                | grep -E "$semver_pattern" \
                | sed -n '1p' \
                || true
            )"
            if [[ "$latest_tag" != "$version_tag" ]]; then
              echo "automatic deployment only accepts the latest release tag: $latest_tag" >&2
              echo "Use workflow_dispatch for an intentional rollback to $version_tag." >&2
              exit 1
            fi
          fi

          printf 'deployment_mode=%s\n' "$deployment_mode" >> "$GITHUB_OUTPUT"
          printf 'version_tag=%s\n' "$version_tag" >> "$GITHUB_OUTPUT"
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    environment: prod
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_BACKEND_MIG: ${{ vars.GCP_BACKEND_MIG }}
      GCP_DEPLOY_PATH: ${{ vars.GCP_DEPLOY_PATH }}
      GCP_FRONTEND_BUCKET: ${{ vars.GCP_FRONTEND_BUCKET }}
      BACKEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/backend
      FRONTEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/frontend
      DEPLOYMENT_MODE: ${{ needs.preflight.outputs.deployment_mode }}
      TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
      VERSION_TAG: ${{ needs.preflight.outputs.version_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: docker/setup-buildx-action@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Inspect release artifacts
        id: artifacts
        run: |
          set -euo pipefail

          backend_exists=false
          frontend_exists=false

          if docker buildx imagetools inspect "${BACKEND_IMAGE}:${VERSION_TAG}" >/dev/null 2>&1; then
            backend_exists=true
          fi
          if docker buildx imagetools inspect "${FRONTEND_IMAGE}:${VERSION_TAG}" >/dev/null 2>&1; then
            frontend_exists=true
          fi

          printf 'backend_exists=%s\n' "$backend_exists" >> "$GITHUB_OUTPUT"
          printf 'frontend_exists=%s\n' "$frontend_exists" >> "$GITHUB_OUTPUT"

          if [[ "$DEPLOYMENT_MODE" == "rollback" ]] && \
             [[ "$backend_exists" != "true" || "$frontend_exists" != "true" ]]; then
            echo "rollback requires existing backend and frontend artifacts for $VERSION_TAG" >&2
            exit 1
          fi

      - name: Build and push backend artifact
        if: needs.preflight.outputs.deployment_mode == 'release' && steps.artifacts.outputs.backend_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.VERSION_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION_TAG }}

      - name: Build and push frontend artifact
        if: needs.preflight.outputs.deployment_mode == 'release' && steps.artifacts.outputs.frontend_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_ENABLE_SENTRY=${{ vars.VITE_ENABLE_SENTRY }}
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.VERSION_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION_TAG }}

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${BACKEND_IMAGE}:${VERSION_TAG}" >/dev/null
          docker buildx imagetools inspect "${FRONTEND_IMAGE}:${VERSION_TAG}" >/dev/null
          docker pull "${BACKEND_IMAGE}:${VERSION_TAG}"
          docker pull "${FRONTEND_IMAGE}:${VERSION_TAG}"

          backend_revision="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "${BACKEND_IMAGE}:${VERSION_TAG}"
          )"
          frontend_revision="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "${FRONTEND_IMAGE}:${VERSION_TAG}"
          )"
          if [[ "$backend_revision" != "$TARGET_SHA" || "$frontend_revision" != "$TARGET_SHA" ]]; then
            echo "release artifacts do not match tag commit $TARGET_SHA" >&2
            echo "backend revision: ${backend_revision:-missing}" >&2
            echo "frontend revision: ${frontend_revision:-missing}" >&2
            exit 1
          fi

          artifact_dir="$RUNNER_TEMP/cmc-frontend-release"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"

          container_id="$(docker create "${FRONTEND_IMAGE}:${VERSION_TAG}")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/usr/share/nginx/html/." "$artifact_dir/"
          docker rm -f "$container_id" >/dev/null
          trap - EXIT

          test -s "$artifact_dir/index.html"

      - name: Deploy backend to GCP
        run: bash .github/scripts/deploy-gcp-backend.sh

      - name: Promote frontend artifact to Cloud Storage
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/cmc-frontend-release"

          test -s "$artifact_dir/index.html"
          gcloud storage rsync "$artifact_dir" "gs://${GCP_FRONTEND_BUCKET}" \
            --recursive \
            --delete-unmatched-destination-objects \
            --exclude='(^|/)index\.html$' \
            --cache-control='public, max-age=31536000, immutable'
          gcloud storage cp "$artifact_dir/index.html" "gs://${GCP_FRONTEND_BUCKET}/index.html" \
            --cache-control='no-cache, no-store, must-revalidate'
          rm -rf "$artifact_dir"
