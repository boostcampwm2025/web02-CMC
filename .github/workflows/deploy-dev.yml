name: deploy-dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: dev
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_BACKEND_MIG: ${{ vars.GCP_BACKEND_MIG }}
      GCP_DEPLOY_PATH: ${{ vars.GCP_DEPLOY_PATH }}
      BACKEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/backend
      VERSION_TAG: dev-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "manual dev deployment must run from the dev branch" >&2
            exit 1
          fi

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: docker/setup-buildx-action@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:dev-latest
            ${{ env.BACKEND_IMAGE }}:${{ env.VERSION_TAG }}

      - name: Deploy backend to GCP
        run: bash .github/scripts/deploy-gcp-backend.sh

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    environment: dev
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_FRONTEND_BUCKET: ${{ vars.GCP_FRONTEND_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm -C packages/types build

      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_ENABLE_SENTRY: ${{ vars.VITE_ENABLE_SENTRY }}
        run: pnpm -C frontend build

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Upload frontend to Cloud Storage
        run: |
          gcloud storage rsync frontend/dist "gs://${GCP_FRONTEND_BUCKET}" \
            --recursive \
            --delete-unmatched-destination-objects \
            --exclude='(^|/)index\.html$' \
            --cache-control='public, max-age=31536000, immutable'
          gcloud storage cp frontend/dist/index.html "gs://${GCP_FRONTEND_BUCKET}/index.html" \
            --cache-control='no-cache, no-store, must-revalidate'
