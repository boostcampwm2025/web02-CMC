name: deploy-fe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/#334-object-storage-cicd

jobs:
  upload-fe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: pnpm -C frontend build

      - name: Install AWS CLI (NCP compatible)
        run: pip install awscli==1.15.85

      - name: Upload to NCP Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NCP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NCP_SECRET_KEY }}
        run: |
          # 1. 정적 자원 (JS, CSS, 이미지) - 1년 캐시 (index.html 제외)
          aws s3 sync frontend/dist/ s3://${{ secrets.NCP_BUCKET }}/ \
            --endpoint-url ${{ secrets.NCP_ENDPOINT }} \
            --exclude "index.html" \
            --delete \
            --acl public-read \
            --cache-control "max-age=31536000, immutable"

          # 2. index.html - 캐시 없음 (항상 최신 버전 유지)
          aws s3 sync frontend/dist/ s3://${{ secrets.NCP_BUCKET }}/ \
            --endpoint-url ${{ secrets.NCP_ENDPOINT }} \
            --exclude "*" \
            --include "index.html" \
            --acl public-read \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployed successfully!"
