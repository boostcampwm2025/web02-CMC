# GCP HTTPS Load Balancer terminates TLS.
# This VM-local Nginx only handles HTTP from Google load balancer proxies.
# Port 80 is restricted to these GFE proxy and health-check ranges by Terraform.

set_real_ip_from 35.191.0.0/16;
set_real_ip_from 130.211.0.0/22;
real_ip_header X-CMC-Client-IP;
real_ip_recursive off;

map $request_method $cmc_api_read_key {
    GET $binary_remote_addr;
    HEAD $binary_remote_addr;
    default "";
}

map $request_method $cmc_api_write_key {
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
    default "";
}

map $http_x_forwarded_proto $cmc_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

limit_req_zone $cmc_api_read_key zone=cmc_api_read_limit:8m rate=24r/s;
limit_req_zone $cmc_api_write_key zone=cmc_api_write_limit:1m rate=3r/s;

server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        proxy_pass http://backend:3000/health/ready;
        proxy_set_header Host $host;
    }

    location = /livez {
        access_log off;
        proxy_pass http://backend:3000/health/live;
        proxy_set_header Host $host;
    }

    location = /api {
        limit_req zone=cmc_api_read_limit burst=40 delay=24;
        limit_req zone=cmc_api_write_limit burst=5 delay=3;
        limit_req_status 429;

        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $cmc_forwarded_proto;
        proxy_set_header X-CMC-Client-IP "";
    }

    location /api/ {
        limit_req zone=cmc_api_read_limit burst=40 delay=24;
        limit_req zone=cmc_api_write_limit burst=5 delay=3;
        limit_req_status 429;

        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $cmc_forwarded_proto;
        proxy_set_header X-CMC-Client-IP "";
    }

    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $cmc_forwarded_proto;
        proxy_set_header X-CMC-Client-IP "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        return 404;
    }
}
