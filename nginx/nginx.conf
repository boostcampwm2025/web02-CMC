# Request Method에 따라 Rate Limit Zone을 분리
map $request_method $cmc_api_read_key {
    GET $binary_remote_addr;
    HEAD $binary_remote_addr;
    default "";
}

map $request_method $cmc_api_write_key {
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    PATCH $binary_remote_addr;
    DELETE $binary_remote_addr;
    default "";
}

# Rate Limit 설정
limit_req_zone $cmc_api_read_key zone=cmc_api_read_limit:8m rate=24r/s;
limit_req_zone $cmc_api_write_key zone=cmc_api_write_limit:1m rate=3r/s;

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name api.coedbattle.kro.kr;

    # certbot 인증서 발급/갱신용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 서버: backend API / WebSocket 전용
server {
    listen 443 ssl;
    server_name api.coedbattle.kro.kr;

    ssl_certificate /etc/letsencrypt/live/api.coedbattle.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.coedbattle.kro.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 백엔드 API
    location /api/ {
        limit_req zone=cmc_api_read_limit burst=40 delay=24;
        limit_req zone=cmc_api_write_limit burst=5 delay=3;
        limit_req_status 429;
        
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # frontend는 NCP Object Storage/CDN에서 서빙한다.
    # API 도메인은 명시된 API/WebSocket 경로만 백엔드로 전달한다.
    location / {
        return 404;
    }
}
